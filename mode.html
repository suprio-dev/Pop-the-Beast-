<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#170f33">
  <meta name="description" content="Choose your game mode in Pop the Beast!">
  <title>Choose Your Mode | Pop the Beast!</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #0e0824;
      --panel: #2a1b5e;
      --panel-2: #3a2680;
      --mint: #4ff2c8;
      --sun: #ffd23f;
      --hot: #ff4f6d;
      --muted: #b9aee8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1.25rem;
      font-family: Nunito, sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse at 10% 10%, rgba(255, 79, 109, .16), transparent 36%),
        radial-gradient(ellipse at 90% 5%, rgba(79, 242, 200, .13), transparent 38%),
        linear-gradient(145deg, #170f33, #241552 60%, #2e1a5e);
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .4;
      background-size: 180px 160px;
      background-image:
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(2px 2px at 110px 90px, var(--sun), transparent),
        radial-gradient(1.5px 1.5px at 70px 140px, var(--mint), transparent);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    /* Header */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 3.2rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .7rem;
      font: .8rem Bungee, sans-serif;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 41px;
      height: 41px;
      color: var(--ink);
      font-size: 1.3rem;
      background: var(--sun);
      border: 3px solid var(--ink);
      border-radius: 13px;
      box-shadow: 0 4px 0 var(--ink);
      transform: rotate(-5deg);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 800;
      transition: color 150ms ease;
    }

    .back-link:hover {
      color: var(--sun);
    }

    /* Heading */

    .hero {
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .45rem .85rem;
      color: var(--mint);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: 1.3px;
      border: 1px solid rgba(79, 242, 200, .25);
      border-radius: 99px;
      background: rgba(79, 242, 200, .06);
    }

    .eyebrow span {
      width: 7px;
      height: 7px;
      background: var(--mint);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--mint);
    }

    h1 {
      margin-top: 1.3rem;
      font: 400 clamp(2rem, 6vw, 3.5rem)/1.3 Bungee, sans-serif;
      color: var(--sun);
      text-shadow: 3px 3px 0 var(--hot), 6px 6px 0 var(--ink);
    }

    .description {
      max-width: 440px;
      margin: .9rem auto 0;
      color: var(--muted);
      font-size: .95rem;
      line-height: 1.8;
    }

    /* Mode selection */

    .modes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.2rem;
      margin-top: 2.8rem;
    }

    .mode-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 1.5rem;
      overflow: hidden;
      text-align: left;
      color: #fff;
      background: linear-gradient(150deg, #34236e, #25164f);
      border: 2px solid rgba(185, 174, 232, .2);
      border-radius: 24px;
      box-shadow: 0 7px 0 var(--ink);
      cursor: pointer;
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background 180ms ease;
    }

    .mode-card:hover {
      transform: translateY(-5px);
      border-color: var(--sun);
    }

    .mode-card.endless:hover {
      border-color: var(--mint);
    }

    .mode-card:focus-visible,
    .start-btn:focus-visible {
      outline: 3px solid var(--mint);
      outline-offset: 4px;
    }

    .mode-card::after {
      content: "";
      position: absolute;
      top: -50px;
      right: -45px;
      width: 135px;
      height: 135px;
      background: rgba(255, 210, 63, .07);
      border-radius: 50%;
      pointer-events: none;
    }

    .endless::after {
      background: rgba(79, 242, 200, .07);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: .5rem;
    }

    .mode-icon {
      display: grid;
      place-items: center;
      width: 60px;
      height: 60px;
      color: var(--ink);
      font-size: 2rem;
      background: var(--sun);
      border: 3px solid var(--ink);
      border-radius: 18px;
      box-shadow: 0 4px 0 var(--ink);
    }

    .endless .mode-icon {
      background: var(--mint);
    }

    .mode-number {
      color: #8f82c9;
      font: .75rem Bungee, sans-serif;
    }

    .mode-kicker {
      margin-top: 1.5rem;
      color: var(--sun);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: 1.4px;
    }

    .endless .mode-kicker {
      color: var(--mint);
    }

    .mode-card h2 {
      margin-top: .55rem;
      font: 400 clamp(1.05rem, 3vw, 1.45rem)/1.5 Bungee, sans-serif;
    }

    .mode-description {
      margin-top: .7rem;
      color: var(--muted);
      font-size: .85rem;
      line-height: 1.8;
    }

    .mode-details {
      display: grid;
      gap: .7rem;
      margin-top: 1.4rem;
      padding: 1rem 0;
      border-top: 1px solid rgba(185, 174, 232, .18);
      border-bottom: 1px solid rgba(185, 174, 232, .18);
    }

    .detail {
      display: flex;
      align-items: center;
      gap: .6rem;
      font-size: .8rem;
      font-weight: 800;
    }

    .detail-icon {
      width: 25px;
      text-align: center;
      font-size: 1rem;
    }

    .detail span:last-child {
      color: var(--muted);
      font-weight: 700;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      margin-top: 1.3rem;
      padding-top: .2rem;
    }

    .select-label {
      font: .7rem Bungee, sans-serif;
      color: #fff;
    }

    .select-arrow {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      color: var(--ink);
      font-size: 1.1rem;
      background: var(--sun);
      border-radius: 11px;
      transition: transform 180ms ease;
    }

    .endless .select-arrow {
      background: var(--mint);
    }

    .mode-card:hover .select-arrow {
      transform: translateX(4px);
    }

    /* Bottom note */

    .bottom-note {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: .6rem;
      margin-top: 2.2rem;
      color: #9386cc;
      font-size: .78rem;
      font-weight: 800;
      text-align: center;
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 3rem;
      padding-top: 1.2rem;
      color: #8275ba;
      font-size: .73rem;
      font-weight: 800;
      text-align: center;
      border-top: 1px solid rgba(185, 174, 232, .13);
    }

    @media (max-width: 600px) {
      body {
        padding: 1.2rem 1rem;
      }

      .topbar {
        margin-bottom: 2.5rem;
      }

      .modes {
        grid-template-columns: 1fr;
        gap: 1.3rem;
        margin-top: 2rem;
      }

      .mode-card {
        padding: 1.3rem;
      }

      .mode-card h2 {
        font-size: 1.3rem;
      }

      .mode-description {
        max-width: 360px;
      }

      .bottom-note {
        line-height: 1.7;
      }

      footer {
        margin-top: 2.3rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Back to home">
        <span class="brand-icon" aria-hidden="true">&#x26A1;</span>
        <span>POP THE BEAST!</span>
      </a>

      <a class="back-link" href="index.html">
        <span aria-hidden="true">&#x2190;</span>
        Back home
      </a>
    </header>

    <section class="hero">
      <div class="eyebrow">
        <span></span>
        PICK YOUR CHALLENGE
      </div>

      <h1>HOW DO YOU<br>WANT TO PLAY?</h1>

      <p class="description">
        Two modes. Different challenges.
        Choose your style and jump into the hunt.
      </p>
    </section>

    <section class="modes" aria-label="Available game modes">

      <a href="time.html">
        <button
        type="button"
        class="mode-card timed"
        data-mode="timed"
        id="timed-mode"
      >
        <div class="card-top">
          <div class="mode-icon" aria-hidden="true">&#x23F1;</div>
          <span class="mode-number">MODE 01</span>
        </div>

        <p class="mode-kicker">QUICK & INTENSE</p>
        <h2>TIME ATTACK</h2>

        <p class="mode-description">
          Every second counts. Catch as many beasts
          as possible before the clock hits zero.
        </p>

        <div class="mode-details">
          <div class="detail">
            <span class="detail-icon" aria-hidden="true">&#x23F1;</span>
            <span>30 seconds</span>
          </div>

          <div class="detail">
            <span class="detail-icon" aria-hidden="true">&#x2665;</span>
            <span>2 lives</span>
          </div>

          <div class="detail">
            <span class="detail-icon" aria-hidden="true">&#x26A1;</span>
            <span>Beat the clock</span>
          </div>
        </div>

        <div class="card-bottom">
          <span class="select-label">SELECT MODE</span>
          <span class="select-arrow" aria-hidden="true">&#x2192;</span>
        </div>
      </button>
      </a>

      <a href="endless.html">
        <button
        type="button"
        class="mode-card endless"
        data-mode="endless"
        id="endless-mode"
      >
        <div class="card-top">
          <div class="mode-icon" aria-hidden="true">&#x221E;</div>
          <span class="mode-number">MODE 02</span>
        </div>

        <p class="mode-kicker">SURVIVAL CHALLENGE</p>
        <h2>ENDLESS</h2>

        <p class="mode-description">
          No countdown and no time pressure.
          Keep catching beasts until your lives run out.
        </p>

        <div class="mode-details">
          <div class="detail">
            <span class="detail-icon" aria-hidden="true">&#x221E;</span>
            <span>No time limit</span>
          </div>

          <div class="detail">
            <span class="detail-icon" aria-hidden="true">&#x2665;</span>
            <span>3 lives</span>
          </div>

          <div class="detail">
            <span class="detail-icon" aria-hidden="true">&#x1F3C6;</span>
            <span>Chase your best</span>
          </div>
        </div>

        <div class="card-bottom">
          <span class="select-label">SELECT MODE</span>
          <span class="select-arrow" aria-hidden="true">&#x2192;</span>
        </div>
      </button>
      </a>

    </section>

    <p class="bottom-note">
      &#x2728; Choose a mode to start your adventure
    </p>

  </main>

  <footer>
    Pop the Beast! &mdash; Trust your reflexes.
  </footer>

  <!-- Add your mode-selection JavaScript here. -->
</body>

</html>
